<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeo-aula</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; background: #DCEBD8; overflow: hidden; }
  .quadro { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  #palco { position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); height: 92vh; aspect-ratio: 1104 / 1840; }
  #palco svg { width: 100%; height: 100%; display: block; }
  .marca { position: absolute; top: 3.2vh; left: 0; right: 0; text-align: center; font: 600 2.4vh "Cormorant Garamond", Georgia, serif; letter-spacing: .3em; color: #2a1d1f; }
  .etiqueta { position: absolute; top: 7vh; left: 0; right: 0; text-align: center; font: 600 1.5vh Inter, sans-serif; letter-spacing: .22em; text-transform: uppercase; color: #8a6a42; }
  .legenda {
    position: absolute; left: 5vw; right: 5vw; bottom: 5vh; text-align: center;
    background: rgba(42, 29, 31, .86); color: #fff8ef; border-radius: 2.2vh; padding: 2vh 3vw;
    font: 600 2.6vh/1.3 Inter, sans-serif; transition: opacity .35s, transform .35s;
  }
  .legenda.sai { opacity: 0; transform: translateY(1vh); }
  .legenda em { color: #F3A7B3; font-style: normal; }
  .zzz { font: 600 70px Inter, sans-serif; fill: #6c7b8c; }
  .zzz text { animation: sobe 1.8s ease-in infinite; }
  .zzz text:nth-child(2) { animation-delay: .6s; } .zzz text:nth-child(3) { animation-delay: 1.2s; }
  @keyframes sobe { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-40px, -120px); } }
</style>
</head>
<body>
<div class="quadro">
  <div class="marca">MÉTODO FEMININO</div>
  <div class="etiqueta" id="etiqueta"></div>
  <div id="palco"></div>
  <div class="legenda sai" id="legenda"></div>
</div>
<script src="personagem.js"></script>
<script>
  var p = Personagem.criar(document.getElementById("palco"));
  var leg = document.getElementById("legenda"), etq = document.getElementById("etiqueta");
  var NS = "http://www.w3.org/2000/svg";

  // "Zzz" saindo do tríceps
  var zzz = document.createElementNS(NS, "g");
  zzz.setAttribute("class", "zzz");
  zzz.innerHTML = '<text x="250" y="520">z</text><text x="230" y="500" font-size="85">z</text><text x="205" y="470" font-size="100">Z</text>';
  zzz.style.display = "none";
  p.svg.appendChild(zzz);

  function legenda(html) {
    leg.classList.add("sai");
    setTimeout(function () { leg.innerHTML = html; if (html) leg.classList.remove("sai"); }, 250);
  }

  var CENAS = {
    mecanismo: {
      etiqueta: "Aula 1 · O músculo dormindo",
      passos: [
        [0, function () { p.pose("repouso"); p.expressao("feliz"); p.destacar(true, "dormindo"); zzz.style.display = ""; legenda("Esse é o <em>tríceps</em>, o músculo de trás do braço."); }],
        [3200, function () { legenda("E na maioria das mulheres… ele está <em>dormindo</em>."); }],
        [6200, function () { zzz.style.display = "none"; p.pose("puxar"); legenda("No dia a dia você só <em>puxa</em>: bolsa, porta, celular…"); }],
        [10000, function () { p.pose("repouso"); p.expressao("orgulho"); legenda("…e quase nunca <em>empurra</em>."); }],
        [12500, function () { p.pose("extensao"); p.expressao("esforco"); p.destacar(true); legenda("O método <em>acorda</em> esse músculo, um pouquinho por dia."); }],
        [17500, function () { p.pose("comemorar"); p.expressao("piscadinha"); p.destacar(false); legenda("E o braço volta a ficar <em>firme</em>. ✨"); }],
        [21000, null]
      ]
    },
    pulsinho: {
      etiqueta: "Dia 1 · Pulsinhos pra trás",
      passos: [
        [0, function () { p.pose("pulsinho"); p.expressao("esforco"); p.destacar(true); legenda("Braços esticados, pulsinhos curtos <em>pra trás</em>."); }],
        [3000, function () { p.expressao("feliz"); legenda("<em>3 séries de 20</em> · descanso de 30s"); }],
        [6000, null]
      ]
    }
  };

  var u = new URLSearchParams(location.search);
  var cena = CENAS[u.get("cena")] || CENAS.mecanismo;
  etq.textContent = cena.etiqueta;
  function rodar() {
    cena.passos.forEach(function (pp) {
      setTimeout(function () { if (pp[1]) pp[1](); else if (u.get("loop") !== "0") rodar(); }, pp[0]);
    });
  }
  // espera as fontes para não "pular" no começo da gravação
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(function () { setTimeout(rodar, 300); });
  window.DURACAO = cena.passos[cena.passos.length - 1][0];
</script>
</body>
</html>
