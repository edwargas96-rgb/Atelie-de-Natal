<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Método Feminino</title>
<meta name="description" content="O método de bastidor que as modelos usam para firmar os braços, adaptado para a mulher depois dos 35.">
<meta name="theme-color" content="#f7f1ea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Flores decorativas de fundo -->
  <div class="flores" aria-hidden="true">
    <svg class="flor flor-1" viewBox="0 0 200 200"><use href="#flor"/></svg>
    <svg class="flor flor-2" viewBox="0 0 200 200"><use href="#flor"/></svg>
    <svg class="flor flor-3" viewBox="0 0 200 200"><use href="#flor"/></svg>
    <svg class="flor flor-4" viewBox="0 0 200 200"><use href="#flor"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="petala" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#f6c9cf"/><stop offset="1" stop-color="#e59aa6"/>
      </linearGradient>
      <g id="flor">
        <path d="M100 100 C92 70 60 40 100 18 C140 40 108 70 100 100Z" fill="url(#petala)"/>
        <path d="M100 100 C92 70 60 40 100 18 C140 40 108 70 100 100Z" fill="url(#petala)" transform="rotate(72 100 100)"/>
        <path d="M100 100 C92 70 60 40 100 18 C140 40 108 70 100 100Z" fill="url(#petala)" transform="rotate(144 100 100)"/>
        <path d="M100 100 C92 70 60 40 100 18 C140 40 108 70 100 100Z" fill="url(#petala)" transform="rotate(216 100 100)"/>
        <path d="M100 100 C92 70 60 40 100 18 C140 40 108 70 100 100Z" fill="url(#petala)" transform="rotate(288 100 100)"/>
        <path d="M100 100 C96 80 80 62 100 50 C120 62 104 80 100 100Z" fill="#fbe3e6" transform="rotate(36 100 100)"/>
        <path d="M100 100 C96 80 80 62 100 50 C120 62 104 80 100 100Z" fill="#fbe3e6" transform="rotate(180 100 100)"/>
        <circle cx="100" cy="100" r="9" fill="none" stroke="#b08d57" stroke-width="2"/>
        <circle cx="100" cy="100" r="3" fill="#b08d57"/>
        <path d="M100 118 C104 150 96 170 112 196" fill="none" stroke="#b08d57" stroke-width="1.6"/>
        <path d="M104 150 C118 140 132 144 138 152 C126 158 114 156 104 150Z" fill="none" stroke="#b08d57" stroke-width="1.4"/>
      </g>
    </defs>
  </svg>
  <header class="topo">
    <button class="voltar" id="voltar" aria-label="Voltar" hidden>&larr;</button>
    <span class="marca">MÉTODO FEMININO</span>
    <span class="espaco"></span>
  </header>
  <div class="barra" id="barra" hidden><span id="barra-fill"></span></div>

  <main id="app" class="app" aria-live="polite"></main>

  <!-- Feedback rápido entre perguntas -->
  <div class="feedback" id="feedback" hidden>
    <div class="feedback-card">
      <span class="feedback-icone">✦</span>
      <p id="feedback-texto"></p>
    </div>
  </div>

  <script src="ilustracoes.js"></script>
  <script src="perguntas.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
