<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Bordando</title>
<style>
*{margin:0;padding:0}html,body{width:405px;height:720px;overflow:hidden;background:#efe6d6}
#cam{position:absolute;left:0;top:0;width:794px;height:1123px;transform-origin:0 0}
iframe{position:absolute;left:0;top:0;width:794px;height:1123px;border:0;background:#fff8ec;box-shadow:0 10px 40px rgba(60,40,20,.25)}
</style></head>
<body><div id="cam"></div>
<script>
// 3 páginas: página inteira -> zoom no molde -> agulha borda -> volta para a página inteira
var CODES = JSON.parse(new URLSearchParams(location.search).get("p") || '["E01","E02","001"]');
var PER = 4.8, cam = document.getElementById("cam"), frames = [];
CODES.forEach(function (c, i) { var f = document.createElement("iframe"); f.src = "build/bordado-" + c + ".html"; f.style.display = i ? "none" : "block"; cam.appendChild(f); frames.push(f); });
window.TIMELINE = { total: PER * CODES.length };
window.ready = function () { return Promise.all(frames.map(function (f) { return new Promise(function (r) { var w = f.contentWindow; if (w && w.stitchAt && w.document.readyState === "complete") return r(); f.onload = function () { f.contentWindow.document.fonts.ready.then(r); }; }); })); };
function ease(x) { x = Math.max(0, Math.min(1, x)); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
var S0 = 405 / 794, P0 = [397, 561.5];             // página inteira: escala e centro
var S1 = 0.93, P1 = [243.8, 510.3];                // molde (cartão) em destaque
window.renderAt = function (t) {
  var i = Math.min(CODES.length - 1, Math.floor(t / PER)), l = t - i * PER;
  frames.forEach(function (f, k) { f.style.display = k === i ? "block" : "none"; });
  var z = l < 0.35 ? 0 : l < 1.05 ? ease((l - 0.35) / 0.7) : l < 4.0 ? 1 : 1 - ease((l - 4.0) / 0.75);
  var s = S0 + (S1 - S0) * z, cx = P0[0] + (P1[0] - P0[0]) * z, cy = P0[1] + (P1[1] - P0[1]) * z;
  cam.style.transform = "translate(" + (202.5 - cx * s) + "px," + (360 - cy * s) + "px) scale(" + s + ")";
  var p = l < 0.85 ? 0 : l > 3.95 ? 1 : (l - 0.85) / 3.1;
  frames[i].contentWindow.stitchAt(p);
};
</script></body></html>
