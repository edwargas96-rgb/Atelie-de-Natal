<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Motion narração</title>
<style>
@font-face{font-family:N;font-weight:800;src:url(../assets/fonts/nunito-sans-latin-700-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#FFF3E0}
#s{position:absolute;inset:0;display:block;width:1080px;height:1920px;font-family:N,sans-serif}
.ov{position:absolute;display:none;font-family:N,sans-serif}
#fone{overflow:hidden;background:#fff;border:14px solid #1d1d1f;box-shadow:0 30px 60px rgba(58,42,32,.35)}
#fone .feed{position:absolute;left:0;top:0;width:100%}
.post{background:#fff;border-bottom:10px solid #f1ebe2}
.post .hd{height:76px;display:flex;align-items:center;gap:14px;padding:0 18px;font:800 26px N;color:#1F4D3A}
.post .hd i{width:50px;height:50px;border-radius:50%;background:#1F4D3A;border:3px solid #D9A441;display:grid;place-items:center;font-style:normal;font-size:26px}
.post img{display:block;width:100%}
.post .ac{height:64px;display:flex;align-items:center;gap:22px;padding:0 20px;font-size:34px;color:#3A2A20}
.post .ac b{display:inline-block}
#lib .mk{position:absolute;left:190px;top:150px;width:700px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35))}
#lib .pg{position:absolute;width:290px;border-radius:12px;border:6px solid #fff;box-shadow:0 14px 30px rgba(0,0,0,.35);backface-visibility:hidden}
</style></head>
<body><svg id="s" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="fone" class="ov"><div class="feed"></div></div>
<div id="lib" class="ov" style="inset:0"></div>
<script>
/* Motion em código, sincronizado com narracao.mp3 (0 – 43,8 s). Cada cena é uma função do tempo t (em segundos, tempo global). */
var C = { wall: "#F8E6C8", pine: "#1F4D3A", pine2: "#2E6B4A", cherry: "#B3282D", gold: "#D9A441", ink: "#3A2A20", skin: "#D9A07A", hair: "#2B1D18", hair2: "#8E5A33", wood: "#C98E5A", wood2: "#B07745", money: "#5FA36A", moletom: "#2A2A2F", paper: "#FFF8EC" };
var OL = 'stroke="' + C.ink + '" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"';
var OL3 = 'stroke="' + C.ink + '" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"';
function cl(x, a, b) { return Math.max(a, Math.min(b, x)); }
function seg(t, a, b) { return cl((t - a) / (b - a), 0, 1); }
function eio(x) { return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function eo(x) { return 1 - Math.pow(1 - x, 3); }
function back(x) { if (x <= 0) return 0; var c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }
function lerp(a, b, k) { return a + (b - a) * k; }
function mix(a, b, k) { return [lerp(a[0], b[0], k), lerp(a[1], b[1], k)]; }
function g(tr, inner, extra) { return '<g transform="' + tr + '"' + (extra || "") + ">" + inner + "</g>"; }
function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function f1(x) { return x.toFixed(1); }

/* fala: a boca só mexe quando há voz (silêncios medidos no áudio) */
var SIL = [[0, .05], [2.82, 3.07], [8.32, 8.74], [8.84, 9.0], [9.48, 9.81], [14.63, 14.82], [16.48, 16.92], [17.92, 18.11], [19.73, 20.05], [25.16, 25.45], [29.05, 29.3], [33.16, 33.4], [39.46, 39.69], [42.65, 42.81], [43.6, 99]];
function fala(t) { for (var i = 0; i < SIL.length; i++) if (t >= SIL[i][0] - .04 && t <= SIL[i][1] + .02) return 0; return Math.abs(Math.sin(t * 13)) * (.55 + .45 * Math.sin(t * 3.1)); }
function pisca(t) { var p = (t % 3.1); return p < .14 ? Math.sin(p / .14 * Math.PI) : 0; }

/* ---------------- objetos bordados ---------------- */
function pontos(pts, step) { var o = []; for (var i = 0; i < pts.length - 1; i++) { var a = pts[i], b = pts[i + 1], d = Math.hypot(b[0] - a[0], b[1] - a[1]), n = Math.max(1, Math.round(d / step)); for (var k = 0; k < n; k++) o.push([lerp(a[0], b[0], k / n), lerp(a[1], b[1], k / n)]); } o.push(pts[pts.length - 1]); return o; }
var ARV = [[0, -280], [110, -120], [50, -120], [170, 40], [90, 40], [220, 200], [-220, 200], [-90, 40], [-170, 40], [-50, -120], [-110, -120], [0, -280]];
function arvPath(sc) { return "M" + ARV.map(function (p) { return f1(p[0] * sc) + " " + f1(p[1] * sc); }).join(" L"); }
function estrelaPts(r) { var p = []; for (var i = 0; i < 10; i++) { var a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; p.push(f1(rr * Math.cos(a)) + "," + f1(rr * Math.sin(a))); } return p.join(" "); }
function estrela(r, cor, sw) { return '<polygon points="' + estrelaPts(r) + '" fill="' + cor + '" stroke="' + C.ink + '" stroke-width="' + (sw || 6) + '" stroke-linejoin="round"/>'; }
function bastidor(r, tipo) { // bastidor com bordado
  var s = '<circle r="' + (r + 9) + '" fill="none" stroke="' + C.wood + '" stroke-width="16"/><circle r="' + (r + 17) + '" fill="none" ' + OL3 + '/><circle r="' + r + '" fill="' + C.paper + '" ' + OL3 + '/>';
  if (tipo === 1) s += '<path d="' + arvPath(r / 330) + '" transform="translate(0,' + f1(r * .05) + ')" fill="none" stroke="' + C.pine2 + '" stroke-width="' + f1(r * .06) + '" stroke-dasharray="' + f1(r * .12) + ' ' + f1(r * .07) + '"/>' + g("translate(0," + f1(-r * .8) + ")", estrela(r * .16, C.gold, 2));
  else { for (var k = 0; k < 6; k++) { var a = k * Math.PI / 3; s += '<path d="M0 0 L' + f1(Math.cos(a) * r * .55) + ' ' + f1(Math.sin(a) * r * .55) + '" stroke="' + C.cherry + '" stroke-width="' + f1(r * .06) + '" stroke-dasharray="' + f1(r * .1) + ' ' + f1(r * .06) + '"/>'; } s += '<circle r="' + f1(r * .12) + '" fill="' + C.gold + '"/>'; }
  s += '<path d="M-22 ' + (-r - 22) + ' q22 -24 0 0 q-22 -24 0 0" fill="' + C.cherry + '" stroke="' + C.cherry + '" stroke-width="10" stroke-linejoin="round"/><path d="M0 ' + (-r - 20) + ' l-14 22 M0 ' + (-r - 20) + ' l14 22" stroke="' + C.cherry + '" stroke-width="8" stroke-linecap="round"/>';
  return s;
}
function enfeiteBordado(r, tipo) { var s = '<path d="M0 ' + (-r - 22) + 'V' + (-r) + '" stroke="' + C.gold + '" stroke-width="3"/><circle r="' + r + '" fill="' + C.paper + '" ' + OL3 + '/>'; if (tipo % 2) s += g("scale(" + (r / 46) + ")", '<path d="' + arvPath(.13) + '" fill="none" stroke="' + C.pine2 + '" stroke-width="5" stroke-dasharray="7 4"/>'); else s += '<polygon points="' + estrelaPts(r * .62) + '" fill="none" stroke="' + C.cherry + '" stroke-width="4" stroke-dasharray="6 4"/>'; return s; }

/* ---------------- cenário: a sala ----------------  o = { decor: 0..1, ceu: 0 (dia) .. 1 (noite), relogio: graus extras } */
function mixCor(a, b, k) { var p = function (h, i) { return parseInt(h.substr(1 + i * 2, 2), 16); }; var o = "#"; for (var i = 0; i < 3; i++) o += ("0" + Math.round(lerp(p(a, i), p(b, i), cl(k, 0, 1))).toString(16)).slice(-2); return o; }
function sala(t, o) {
  o = o || {}; var dec = o.decor || 0, ceu = o.ceu || 0;
  var s = '<rect width="1080" height="1920" fill="' + C.wall + '"/><rect width="1080" height="70" fill="' + C.pine + '"/>';
  for (var r = 0; r < 12; r++) for (var c = 0; c < 9; c++) s += '<circle cx="' + (60 + c * 125 + (r % 2) * 62) + '" cy="' + (130 + r * 105) + '" r="5" fill="#EFD5AE"/>';
  var sky = ceu < .5 ? mixCor("#9FD3F2", "#E9A36B", ceu * 2) : mixCor("#E9A36B", "#22385E", ceu * 2 - 1);
  s += '<clipPath id="jan"><rect x="90" y="260" width="330" height="420" rx="18"/></clipPath><rect x="90" y="260" width="330" height="420" rx="18" fill="' + sky + '"/><g clip-path="url(#jan)">';
  s += '<circle cx="330" cy="' + f1(lerp(340, 640, cl(ceu * 1.6, 0, 1))) + '" r="44" fill="#FFD45E" opacity="' + cl(1 - ceu * 1.5, 0, 1).toFixed(2) + '"/>';
  s += '<g opacity="' + cl((ceu - .55) * 3, 0, 1).toFixed(2) + '"><circle cx="190" cy="350" r="40" fill="#FFF3C4"/><circle cx="208" cy="338" r="36" fill="' + sky + '"/></g>';
  for (var k = 0; k < 24; k++) { var x = 100 + rnd(k) * 310, y = 270 + ((rnd(k + 50) * 420 + t * (40 + rnd(k + 9) * 40)) % 410); s += '<circle cx="' + f1(x) + '" cy="' + f1(y) + '" r="' + f1(4 + rnd(k + 3) * 5) + '" fill="#fff" opacity=".85"/>'; }
  s += '</g><path d="M90 630 Q255 590 420 630 L420 680 L90 680Z" fill="#fff"/>';
  s += '<path d="M255 260V680M90 470H420" stroke="' + C.wood2 + '" stroke-width="14"/><rect x="90" y="260" width="330" height="420" rx="18" fill="none" ' + OL + '/>';
  s += '<rect x="70" y="672" width="370" height="30" rx="10" fill="' + C.wood + '" ' + OL + '/>';
  var rel = (o.relogio || 0) + t * 6;
  s += g("translate(640,300)", '<circle r="62" fill="#fff" ' + OL + '/><circle r="4" fill="' + C.ink + '"/>' + [0, 1, 2, 3].map(function (i) { return '<path d="M0 -50 V-40" ' + OL + ' transform="rotate(' + (i * 90) + ')"/>'; }).join("") +
    '<path d="M0 0 V-30" ' + OL + ' stroke-width="8" transform="rotate(' + f1(rel / 12) + ')"/><path d="M0 0 V-44" ' + OL + ' transform="rotate(' + f1(rel) + ')"/>');
  // varal: bandeirinhas que viram cartões bordados
  s += '<path d="M0 150 Q540 250 1080 150" fill="none" stroke="' + C.ink + '" stroke-width="4"/>';
  for (var b = 0; b < 9; b++) {
    var bx = 60 + b * 120, by = 150 + Math.sin(Math.PI * bx / 1080) * 98, sw = Math.sin(t * 2.4 + b) * 4, kb = back(seg(dec, .1 + b * .04, .4 + b * .04));
    s += g("translate(" + bx + "," + f1(by) + ") rotate(" + f1(sw) + ")", kb > .02 ? g("scale(" + kb.toFixed(3) + ")", '<rect x="-30" y="2" width="60" height="78" rx="4" fill="' + C.paper + '" ' + OL3 + '/>' + g("translate(0,40)", b % 2 ? '<polygon points="' + estrelaPts(20) + '" fill="none" stroke="' + C.cherry + '" stroke-width="3.5" stroke-dasharray="5 3"/>' : '<path d="' + arvPath(.1) + '" fill="none" stroke="' + C.pine2 + '" stroke-width="3.5" stroke-dasharray="5 3"/>') + '<circle cy="2" r="5" fill="' + C.gold + '"/>') : '<path d="M-34 0 L34 0 L0 62Z" fill="' + [C.cherry, C.gold, C.pine2][b % 3] + '" ' + OL + '/>');
  }
  // bastidores bordados na parede
  [[560, 560, 70, 1, .2], [740, 510, 52, 2, .3], [690, 700, 46, 2, .38]].forEach(function (h) { var kb = back(seg(dec, h[4], h[4] + .3)); if (kb > .02) s += g("translate(" + h[0] + "," + h[1] + ") scale(" + kb.toFixed(3) + ") rotate(" + f1(Math.sin(t * 1.5 + h[0]) * 2) + ")", bastidor(h[2], h[3])); });
  s += '<rect y="1480" width="1080" height="440" fill="' + C.wood + '"/>';
  for (var f = 0; f < 6; f++) s += '<path d="M0 ' + (1540 + f * 70) + 'H1080" stroke="' + C.wood2 + '" stroke-width="5"/>';
  s += '<rect y="1470" width="1080" height="22" fill="' + C.wood2 + '"/>';
  s += '<ellipse cx="520" cy="1650" rx="420" ry="85" fill="' + C.cherry + '" opacity=".9"/><ellipse cx="520" cy="1650" rx="360" ry="62" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="16 14"/>';
  s += arvore(860, 1480, t, dec);
  if (ceu > .6) s += '<rect width="1080" height="1920" fill="#1b2440" opacity="' + ((ceu - .6) * .3).toFixed(3) + '"/>';
  return s;
}
function arvore(x, y, t, dec) {
  var s = '<rect x="' + (x - 26) + '" y="' + (y - 90) + '" width="52" height="90" fill="' + C.wood2 + '" ' + OL + '/>';
  s += '<path d="M' + (x - 130) + ' ' + (y - 70) + ' L' + (x + 130) + ' ' + (y - 70) + ' L' + (x + 106) + ' ' + y + ' L' + (x - 106) + ' ' + y + 'Z" fill="' + C.cherry + '" ' + OL + '/>';
  [[230, y - 120, 140], [190, y - 300, 140], [140, y - 470, 130]].forEach(function (l) {
    s += '<path d="M' + (x - l[0]) + ' ' + l[1] + ' L' + x + ' ' + (l[1] - l[2] * 1.6) + ' L' + (x + l[0]) + ' ' + l[1] + ' Q' + x + ' ' + (l[1] + 40) + ' ' + (x - l[0]) + ' ' + l[1] + 'Z" fill="' + C.pine2 + '" ' + OL + '/>';
  });
  for (var i = 0; i < 16; i++) {
    var row = i % 4, k = Math.floor(i / 4), wy = y - 170 - row * 150 + k * 12, half = 170 - row * 38, lx = x - half + (k + .5) * (2 * half / 4);
    var on = (Math.sin(t * 5 + i * 1.7) + 1) / 2, col = [C.gold, "#FF6B6B", "#FFE08A", "#7FD1FF"][i % 4];
    s += '<circle cx="' + f1(lx) + '" cy="' + f1(wy) + '" r="' + f1(11 + on * 3) + '" fill="' + col + '" opacity="' + (.55 + on * .45).toFixed(2) + '" ' + OL3 + '/>';
  }
  [[x - 120, y - 210, 0, .45], [x + 95, y - 250, 1, .55], [x - 60, y - 420, 1, .62], [x + 60, y - 560, 0, .7], [x - 10, y - 300, 0, .78]].forEach(function (e, n) {
    var kb = back(seg(dec, e[3], e[3] + .25)); if (kb > .02) s += g("translate(" + e[0] + "," + e[1] + ") scale(" + kb.toFixed(3) + ") rotate(" + f1(Math.sin(t * 2 + n) * 5) + ")", enfeiteBordado(34, e[2]));
  });
  s += g("translate(" + x + "," + (y - 700) + ") scale(" + (1 + Math.sin(t * 3) * .06).toFixed(3) + ")", estrela(48, C.gold));
  return s;
}

/* ---------------- a personagem (versão bonequinha da expert) ---------------- */
function manga(pth, sc) { // manga de moletom preta com duas listras brancas
  return ['<path d="' + pth + '" fill="none" stroke="' + C.ink + '" stroke-width="' + 76 * sc + '" stroke-linecap="round" stroke-linejoin="round"/>',
    '<path d="' + pth + '" fill="none" stroke="' + C.moletom + '" stroke-width="' + 64 * sc + '" stroke-linecap="round" stroke-linejoin="round"/>',
    '<path d="' + pth + '" fill="none" stroke="#fff" stroke-width="' + 26 * sc + '" stroke-linejoin="round"/>',
    '<path d="' + pth + '" fill="none" stroke="' + C.moletom + '" stroke-width="' + 10 * sc + '" stroke-linejoin="round"/>'].join("");
}
function mao(hx, hy, r, item, dedo) {
  var s = "";
  if (dedo != null) s += g("translate(" + f1(hx) + "," + f1(hy) + ") rotate(" + dedo + ")", '<rect x="-10" y="' + (r * .4) + '" width="20" height="' + (r * 1.5) + '" rx="10" fill="' + C.skin + '" ' + OL + '/>');
  s += '<circle cx="' + f1(hx) + '" cy="' + f1(hy) + '" r="' + r + '" fill="' + C.skin + '" ' + OL + '/>';
  if (item) s += g("translate(" + f1(hx) + "," + f1(hy) + ")", item);
  return s;
}
function braco(sx, sy, hx, hy, item, lado, dedo) {
  var L1 = 150, L2 = 135, dx = hx - sx, dy = hy - sy, d = Math.min(Math.hypot(dx, dy), L1 + L2 - 1), base = Math.atan2(dy, dx);
  var a = Math.acos(cl((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1)), sg = lado > 0 ? -1 : 1;
  if (lado > 0 && dy < 0) sg = 1; if (lado < 0 && dy < 0) sg = -1;
  var ex = sx + L1 * Math.cos(base + sg * a), ey = sy + L1 * Math.sin(base + sg * a);
  var k = d / Math.hypot(dx, dy); hx = sx + dx * k; hy = sy + dy * k;
  return manga('M' + sx + ' ' + sy + ' L' + f1(ex) + ' ' + f1(ey) + ' L' + f1(hx) + ' ' + f1(hy), 1) + mao(hx, hy, 30, item, dedo);
}
function cabeca(o) {
  var hum = o.humor || "feliz", h = "";
  var bun = [[0, -150, 52, 0], [-44, -128, 36, 1], [44, -130, 38, 0], [-20, -186, 32, 1], [26, -182, 30, 0], [-62, -96, 26, 0], [64, -98, 26, 1], [4, -205, 22, 1]];
  bun.forEach(function (b) { h += '<circle cx="' + b[0] + '" cy="' + b[1] + '" r="' + b[2] + '" fill="' + (b[3] ? C.hair2 : C.hair) + '" ' + OL + '/>'; });
  for (var i = 0; i < 5; i++) { var a = -2.6 + i * .55; h += '<path d="M' + f1(Math.cos(a) * 60) + ' ' + f1(-150 + Math.sin(a) * 60) + ' q' + f1(Math.cos(a) * 16) + ' ' + f1(Math.sin(a) * 16 - 10) + ' ' + f1(Math.cos(a) * 26) + ' ' + f1(Math.sin(a) * 26) + '" fill="none" stroke="' + C.hair2 + '" stroke-width="7" stroke-linecap="round"/>'; }
  h += '<circle cx="0" cy="0" r="148" fill="' + C.hair + '" ' + OL + '/>';
  h += '<circle cx="-124" cy="30" r="22" fill="' + C.skin + '" ' + OL + '/><circle cx="124" cy="30" r="22" fill="' + C.skin + '" ' + OL + '/>';
  h += '<ellipse cx="0" cy="22" rx="124" ry="132" fill="' + C.skin + '" ' + OL + '/>';
  h += '<circle cx="-128" cy="62" r="15" fill="none" stroke="' + C.gold + '" stroke-width="7"/><circle cx="128" cy="62" r="15" fill="none" stroke="' + C.gold + '" stroke-width="7"/>';
  h += '<path d="M-126 -6 Q-110 -112 0 -112 Q110 -112 126 -6 Q100 -80 0 -82 Q-100 -80 -126 -6Z" fill="' + C.hair + '" ' + OL + '/>';
  h += '<path d="M-112 -40 q-26 50 -6 96" fill="none" stroke="' + C.hair + '" stroke-width="9" stroke-linecap="round"/><path d="M114 -42 q28 46 8 92" fill="none" stroke="' + C.hair + '" stroke-width="9" stroke-linecap="round"/>';
  var pis = o.pisca || 0, fech = hum === "rindo" || hum === "sonhando";
  if (fech) h += '<path d="M-70 26 Q-48 4 -26 26" fill="none" ' + OL + ' stroke-width="9"/><path d="M26 26 Q48 4 70 26" fill="none" ' + OL + ' stroke-width="9"/>';
  else {
    var big = hum === "surpresa", ry = (big ? 26 : 19) * (1 - pis) + 2;
    h += '<ellipse cx="-48" cy="24" rx="' + (big ? 20 : 15) + '" ry="' + f1(ry) + '" fill="' + C.ink + '"/><ellipse cx="48" cy="24" rx="' + (big ? 20 : 15) + '" ry="' + f1(ry) + '" fill="' + C.ink + '"/>';
    if (pis < .5) h += '<circle cx="-42" cy="16" r="5" fill="#fff"/><circle cx="54" cy="16" r="5" fill="#fff"/>';
    if (hum === "cansada") h += '<path d="M-72 22 Q-48 8 -24 22 L-24 0 L-72 0Z M24 22 Q48 8 72 22 L72 0 L24 0Z" fill="' + C.skin + '"/><path d="M-72 22 Q-48 10 -24 22 M24 22 Q48 10 72 22" fill="none" ' + OL + ' stroke-width="6"/>';
  }
  var bw = hum === "preocupada" ? 1 : hum === "surpresa" ? .45 : hum === "cansada" ? -.3 : 0;
  h += '<path d="M-82 ' + f1(-18 - bw * 2) + ' Q-56 ' + f1(-34 - bw * 12) + ' -24 ' + f1(-26 - bw * 26) + '" fill="none" stroke="' + C.hair + '" stroke-width="15" stroke-linecap="round"/>';
  h += '<path d="M82 ' + f1(-18 - bw * 2) + ' Q56 ' + f1(-34 - bw * 12) + ' 24 ' + f1(-26 - bw * 26) + '" fill="none" stroke="' + C.hair + '" stroke-width="15" stroke-linecap="round"/>';
  h += '<path d="M-6 40 Q-12 70 4 74" fill="none" stroke="#B8794F" stroke-width="6" stroke-linecap="round"/>';
  h += '<circle cx="-80" cy="72" r="20" fill="#E8826F" opacity=".45"/><circle cx="80" cy="72" r="20" fill="#E8826F" opacity=".45"/>';
  var fa = o.fala || 0;
  if (hum === "rindo") h += '<path d="M-44 92 Q0 ' + f1(150 + fa * 10) + ' 44 92Z" fill="#8E2B2B" ' + OL + '/><path d="M-30 96 Q0 106 30 96" fill="none" stroke="#fff" stroke-width="8"/>';
  else if (hum === "surpresa") h += '<ellipse cx="0" cy="104" rx="20" ry="' + f1(22 + fa * 8) + '" fill="#8E2B2B" ' + OL + '/>';
  else if (hum === "preocupada") h += fa > .15 ? '<ellipse cx="0" cy="104" rx="' + f1(20 + fa * 6) + '" ry="' + f1(9 + fa * 13) + '" fill="#8E2B2B" ' + OL + '/>' : '<path d="M-40 108 q13 -14 26 0 t26 0 t26 0" fill="none" ' + OL + ' stroke-width="8"/>';
  else if (hum === "cansada") h += fa > .15 ? '<ellipse cx="0" cy="104" rx="16" ry="' + f1(8 + fa * 12) + '" fill="#8E2B2B" ' + OL + '/>' : '<path d="M-26 106 H26" ' + OL + ' stroke-width="8"/>';
  else h += fa > .15 ? '<path d="M-38 90 Q0 ' + f1(124 + fa * 20) + ' 38 90Z" fill="#8E2B2B" ' + OL + '/>' : '<path d="M-40 90 Q0 126 40 90" fill="none" ' + OL + ' stroke-width="8"/>';
